# Codemagic CI — iOS builds for the SchoolSync mobile apps.
#
# The default workflow produces an UNSIGNED .ipa, which needs no Apple
# Developer account. You then re-sign it on your own machine with Sideloadly
# using a free Apple ID and install it on your iPhone. That build lasts 7 days
# before iOS revokes it, which is a limit of free signing, not of this config.
#
# What works in an unsigned/free-signed build:
#   the whole UI, login, per-school branding, every screen, Face ID app lock
#
# What does not, because both need paid-account entitlements:
#   push notifications (APNs) and NFC (Core NFC)
#
# Two workflows:
#   ios-student-unsigned  SchoolSync         — everything works except push
#   ios-attend-unsigned   SchoolSync Attend  — everything works except NFC
#
# Attend installs on a free Apple ID because its entitlements file is not wired
# into the Xcode project, so the app never asks for the NFC capability it
# could not be granted. Scanning screens fall back to manual entry, which is
# enough to check layout and flow. Real NFC testing happens on Android.

workflows:
  ios-student-unsigned:
    name: SchoolSync Student — unsigned iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest
      groups:
        # Create this group in Codemagic → Environment variables, containing:
        #   VITE_SUPABASE_URL
        #   VITE_SUPABASE_ANON_KEY
        # .env is gitignored, so without these Vite bakes `undefined` into the
        # bundle, src/lib/supabase.ts throws at module load, and the app opens
        # to a white screen with nothing in the build output to explain it.
        # The anon key is public by design — RLS is what protects the data —
        # but it still belongs in CI config rather than the repo.
        - supabase
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    scripts:
      - name: Check required environment variables
        # Fail here, in two seconds, rather than after a fifteen-minute build
        # that produces an app which cannot start.
        script: |
          missing=0
          for var in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "$(eval echo \$$var)" ]; then
              echo "MISSING: $var"
              missing=1
            else
              echo "ok: $var is set"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "Add these to the 'supabase' variable group in Codemagic."
            echo "Without them the app builds successfully and launches white."
            exit 1
          fi

      - name: Install dependencies
        script: npm ci

      - name: Build the student web bundle
        # Produces dist-student/, which capacitor.config.ts points at as webDir.
        # Vite reads VITE_-prefixed variables straight from the environment, so
        # the group above is picked up without writing a .env file.
        script: npm run build:student

      - name: Verify Supabase config was baked into the bundle
        # import.meta.env is inlined at build time. If the variable was absent
        # the bundle contains `undefined` and the app throws on first import —
        # which looks identical to a successful build until it runs.
        script: |
          if grep -rq "supabase.co" dist-student/assets/*.js; then
            echo "ok: Supabase URL is present in the bundle"
          else
            echo "FATAL: no Supabase URL in the built bundle."
            echo "VITE_SUPABASE_URL was not available at build time."
            exit 1
          fi

      - name: Sync the iOS project
        # Copies dist-student into the native project and registers plugins.
        # CAP_APP is unset, so capacitor.config.ts resolves to the student app.
        script: npx cap sync ios

      - name: Verify web assets reached the native project
        # A build that ships without ios/App/App/public still compiles and
        # installs — it just launches to a white screen, because index.html
        # and the JS bundle are simply absent. Failing loudly here turns a
        # confusing runtime symptom into an obvious build error.
        script: |
          PUBLIC_DIR="ios/App/App/public"
          echo "--- $PUBLIC_DIR ---"
          ls -la "$PUBLIC_DIR" || { echo "MISSING: cap sync did not create $PUBLIC_DIR"; exit 1; }
          test -f "$PUBLIC_DIR/index.html" || { echo "MISSING: $PUBLIC_DIR/index.html"; exit 1; }
          echo "--- assets ---"
          ls -la "$PUBLIC_DIR/assets" | head -20
          echo "--- total size ---"
          du -sh "$PUBLIC_DIR"

      - name: Resolve Swift package dependencies
        # Capacitor 8 uses SPM rather than CocoaPods — there is no Podfile.
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies

      - name: Archive without code signing
        # Signing is skipped entirely; Sideloadly applies your own signature
        # afterwards. Building unsigned is what removes the need for an Apple
        # Developer account at this stage.
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package the .app into an .ipa
        # An .ipa is just a zip with the .app inside a folder named Payload.
        # xcodebuild -exportArchive is not usable here because exporting
        # requires a signing identity.
        script: |
          cd "$CM_BUILD_DIR"
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/

          # Confirm the assets survived into the built .app, not just the
          # source tree. A folder reference that failed to copy shows up here
          # and nowhere else until the app launches white on a device.
          echo "--- App.app contents ---"
          ls -la Payload/App.app
          echo "--- bundled web assets ---"
          ls -la Payload/App.app/public 2>/dev/null | head -10 \
            || { echo "FATAL: public/ is missing from the built app"; exit 1; }
          test -f Payload/App.app/public/index.html \
            || { echo "FATAL: index.html missing from the built app"; exit 1; }
          du -sh Payload/App.app Payload/App.app/public

          zip -r SchoolSync-unsigned.ipa Payload -x '*.DS_Store'
          ls -lh SchoolSync-unsigned.ipa

    artifacts:
      - SchoolSync-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - admin@schoolsyncedu.com
        notify:
          success: true
          failure: true

  ios-attend-unsigned:
    name: SchoolSync Attend — unsigned iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    # NFC will NOT work in this build.
    #
    # Core NFC needs the com.apple.developer.nfc.readersession.formats
    # entitlement, which Apple only grants to paid developer accounts.
    # ios-attend/App/App/App.entitlements requests it but is deliberately not
    # wired into the Xcode project (CODE_SIGN_ENTITLEMENTS is unset), because
    # a free Apple ID cannot sign an app that asks for it.
    #
    # So this build is for checking layout and flow on an iPhone. lib/nfc
    # reports NFC unavailable and every scanning screen falls back to manual
    # entry, which is the same path used when a card is lost or a chip fails.
    #
    # To make NFC work on iOS once there is a paid account: set
    # CODE_SIGN_ENTITLEMENTS = App/App.entitlements on the App target and
    # sign with a provisioning profile carrying the NFC capability.
    # Real NFC testing happens on Android, which has no such restriction.

    environment:
      node: 22
      xcode: latest
      groups:
        - supabase
      vars:
        XCODE_PROJECT: "ios-attend/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    scripts:
      - name: Check required environment variables
        script: |
          missing=0
          for var in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "$(eval echo \$$var)" ]; then
              echo "MISSING: $var"; missing=1
            else
              echo "ok: $var is set"
            fi
          done
          [ "$missing" = "1" ] && { echo "Add these to the 'supabase' variable group."; exit 1; }
          exit 0

      - name: Install dependencies
        script: npm ci

      - name: Build the attend web bundle
        script: npm run build:attend

      - name: Verify Supabase config was baked into the bundle
        script: |
          grep -rq "supabase.co" dist-attend/assets/*.js \
            || { echo "FATAL: VITE_SUPABASE_URL missing at build time"; exit 1; }
          echo "ok: Supabase URL present"

      - name: Sync the iOS project
        # CAP_APP selects the attend config, which points webDir at dist-attend
        # and the native projects at ios-attend/.
        script: CAP_APP=attend npx cap sync ios

      - name: Verify web assets reached the native project
        script: |
          PUBLIC_DIR="ios-attend/App/App/public"
          ls -la "$PUBLIC_DIR" || { echo "MISSING: $PUBLIC_DIR"; exit 1; }
          test -f "$PUBLIC_DIR/index.html" || { echo "MISSING: index.html"; exit 1; }
          du -sh "$PUBLIC_DIR"

      - name: Resolve Swift package dependencies
        script: |
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies

      - name: Archive without code signing
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/build/Attend.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package the .app into an .ipa
        script: |
          cd "$CM_BUILD_DIR"
          mkdir -p Payload
          cp -R build/Attend.xcarchive/Products/Applications/App.app Payload/
          test -f Payload/App.app/public/index.html \
            || { echo "FATAL: web assets missing from the built app"; exit 1; }
          du -sh Payload/App.app
          zip -r SchoolSyncAttend-unsigned.ipa Payload -x '*.DS_Store'
          ls -lh SchoolSyncAttend-unsigned.ipa

    artifacts:
      - SchoolSyncAttend-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - admin@schoolsyncedu.com
        notify:
          success: true
          failure: true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout extend under the notch / home
         indicator once this runs inside Capacitor. Zoom is left enabled on
         purpose — inputs use a 16px minimum instead, which stops iOS
         auto-zooming on focus without taking pinch-zoom away from anyone
         who needs it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2d4fd6" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <title>SchoolSync</title>

    <link rel="icon" type="image/png" href="/SchoolSync_logo.png" />
    <link rel="apple-touch-icon" href="/SchoolSync_logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/student/main.tsx"></script>
  </body>
</html>
